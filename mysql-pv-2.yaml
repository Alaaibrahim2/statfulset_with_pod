kind: PersistentVolume
metadata:
  name: mysql-pv-2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mysql-static
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-096419cc09d343907
